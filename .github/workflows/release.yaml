name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libpixman-1-dev \
            libfreetype6-dev \
            libdbus-1-dev \
            pkg-config \
            meson \
            ninja-build \
            libseat-dev \
            libgbm-dev \
            libgles2-mesa-dev \
            libudev-dev \
            libinput-dev \
            libdisplay-info-dev \
            libliftoff-dev

      - name: Build and install wlroots 0.19
        run: |
          git clone --depth 1 --branch 0.19.0 https://gitlab.freedesktop.org/wlroots/wlroots.git
          cd wlroots
          meson setup build --buildtype=release -Dexamples=false
          ninja -C build
          sudo ninja -C build install

      - name: Build Sailer
        run: zig build -Doptimize=ReleaseSafe

      - name: Generate Changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 ${GITHUB_REF_NAME}^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            git log --pretty=format:"* %s (%h)" > CHANGELOG.md
          else
            git log --pretty=format:"* %s (%h)" ${PREVIOUS_TAG}..${GITHUB_REF_NAME} > CHANGELOG.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            zig-out/bin/sailer
            zig-out/bin/sailer-mcp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
